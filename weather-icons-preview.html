<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 11 Fluent 3D Weather Icons — Studio & Workbench</title>
  <style>
    :root {
      --bg: #070913;
      --surface: #0e1424;
      --surface-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #070913 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* Header */
    header {
      background: rgba(7, 9, 19, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ffd000, #ff6b00);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 107, 0, 0.4);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-title span {
      background: linear-gradient(120deg, #ffd000, #ff6b00, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Controls Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 4px 8px;
    }

    .control-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn.active {
      color: #fff;
      background: #0284c7;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 24px 32px 64px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* -------------------------------------------------------------
       HERO WEATHER CARD (Exact Windows 11 Seattle Mock)
       ------------------------------------------------------------- */
    .hero-container {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }

    .win11-card {
      width: 580px;
      background: linear-gradient(135deg, rgba(94, 92, 230, 0.75) 0%, rgba(59, 130, 246, 0.65) 100%);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      padding: 22px 28px 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-left-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hero-canvas-wrap {
      width: 110px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .hero-text-block {
      display: flex;
      flex-direction: column;
    }

    .city-name {
      font-size: 1.15rem;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.2;
    }

    .temp-row {
      display: flex;
      align-items: flex-start;
      margin-top: -2px;
    }

    .big-temp {
      font-size: 4.6rem;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .temp-units {
      margin-left: 6px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      font-size: 1.3rem;
      font-weight: 400;
      line-height: 1.1;
      color: rgba(255, 255, 255, 0.85);
    }

    .unit-secondary {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .card-right-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      gap: 2px;
    }

    .meta-pills {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .cond-title {
      font-size: 1.25rem;
      font-weight: 500;
      color: #ffffff;
      margin-top: 2px;
    }

    .high-low {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Forecast Strip */
    .forecast-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .forecast-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .forecast-time {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .forecast-canvas-wrap {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .forecast-temp {
      font-size: 1.05rem;
      color: #ffffff;
      font-weight: 500;
    }

    /* -------------------------------------------------------------
       15-ICON DESIGN SYSTEM GRID
       ------------------------------------------------------------- */
    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .gallery-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .filter-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .icon-card {
      background: rgba(14, 20, 36, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .icon-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      background: rgba(20, 28, 50, 0.9);
    }

    .icon-card.active-card {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 12px 24px rgba(0, 0, 0, 0.5);
    }

    .card-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .code-badge {
      font-size: 0.72rem;
      font-family: ui-monospace, Menlo, monospace;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .icon-preview-box {
      height: 120px;
      background: radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-desc {
      font-size: 0.76rem;
      color: var(--text-muted);
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7" fill="#fff"/></svg>
      </div>
      <div class="brand-title">Windows 11 Fluent 3D <span>Weather Studio</span></div>
    </div>

    <div class="toolbar">
      <div class="control-group">
        <span class="control-label">Card Theme</span>
        <button class="btn active" id="btnThemePurple">Fluent Purple</button>
        <button class="btn" id="btnThemeDark">Slate Dark</button>
      </div>

      <div class="control-group">
        <span class="control-label">Animation</span>
        <button class="btn active" id="btnAnimPlay">Play</button>
        <button class="btn" id="btnAnimSlow">0.5x</button>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO PREVIEW (Exact match of reference image) -->
    <div class="hero-container">
      <div class="win11-card" id="heroCard">
        <div class="card-top">
          <div class="card-left-group">
            <div class="hero-canvas-wrap">
              <canvas id="heroBigCanvas" width="220" height="180" style="width: 110px; height: 90px;"></canvas>
            </div>
            <div class="hero-text-block">
              <span class="city-name">Seattle, WA</span>
              <div class="temp-row">
                <span class="big-temp">63</span>
                <div class="temp-units">
                  <span>°F</span>
                  <span class="unit-secondary">°C</span>
                </div>
              </div>
            </div>
          </div>
          <div class="card-right-group">
            <div class="meta-pills">
              <span>░ 58</span>
              <span>💧 20%</span>
            </div>
            <div class="cond-title" id="heroCondTitle">Mostly Sunny</div>
            <div class="high-low">77° / 53°</div>
          </div>
        </div>

        <!-- 6-Hour Forecast Strip (Rain pills matching reference) -->
        <div class="forecast-strip" id="forecastStrip">
          <!-- Populated in JS -->
        </div>
      </div>
    </div>

    <!-- 15 FULL CONDITIONS GALLERY -->
    <div class="gallery-header">
      <div class="gallery-title">
        <span>Complete Fluent 3D Icon Set</span>
        <span style="font-size: 0.85rem; font-weight: 400; color: var(--text-muted);">(15 Conditions • Click any icon to preview in hero card)</span>
      </div>
      <div class="filter-pills">
        <button class="filter-btn active" data-filter="all">All (15)</button>
        <button class="filter-btn" data-filter="clear">Clear</button>
        <button class="filter-btn" data-filter="clouds">Clouds</button>
        <button class="filter-btn" data-filter="rain">Rain</button>
        <button class="filter-btn" data-filter="snow">Snow</button>
        <button class="filter-btn" data-filter="storm">Storm</button>
        <button class="filter-btn" data-filter="fog">Fog</button>
      </div>
    </div>

    <div class="grid-container" id="gridContainer">
      <!-- Populated in JS -->
    </div>
  </main>

  <script>
    /* =========================================================================
       EXACT 15 WEATHER CONDITIONS
       ========================================================================= */
    const CONDITIONS = [
      { id: "partly-day", name: "Mostly Sunny", category: "clouds", code: 2, isDay: true, desc: "Golden sun sphere behind soft white cloud with drop shadow" },
      { id: "clear-day", name: "Sunny / Clear Day", category: "clear", code: 0, isDay: true, desc: "Large luscious amber-orange 3D sun sphere" },
      { id: "clear-night", name: "Clear Night", category: "clear", code: 0, isDay: false, desc: "Golden 3D crescent moon with subtle stars" },
      { id: "partly-night", name: "Partly Night", category: "clouds", code: 2, isDay: false, desc: "Golden crescent moon behind soft night cloud" },
      { id: "cloudy", name: "Overcast / Cloudy", category: "clouds", code: 3, isDay: true, desc: "Layered white cloud with soft blue-gray rear cloud" },
      { id: "fog", name: "Fog & Mist", category: "fog", code: 45, isDay: true, desc: "Translucent rounded atmospheric mist bands" },
      { id: "drizzle", name: "Light Drizzle", category: "rain", code: 51, isDay: true, desc: "Cloud with delicate 2-drop cyan rain pills" },
      { id: "light-rain", name: "Light Rain", category: "rain", code: 61, isDay: true, desc: "Dual clouds with 3 parallel cyan rain pills" },
      { id: "rain", name: "Moderate Rain", category: "rain", code: 63, isDay: true, desc: "Exact Windows 11 forecast icon: 5 staggered cyan rain pills" },
      { id: "heavy-rain", name: "Heavy Rain", category: "rain", code: 65, isDay: true, desc: "Storm cloud with rapid falling cyan rain streaks" },
      { id: "light-snow", name: "Light Snow", category: "snow", code: 71, isDay: true, desc: "Soft white cloud with 3 floating 3D snow spheres" },
      { id: "snow", name: "Moderate Snow", category: "snow", code: 73, isDay: true, desc: "Dual clouds with swaying 3D snow orbs" },
      { id: "heavy-snow", name: "Blizzard", category: "snow", code: 75, isDay: true, desc: "Dense flurry with fast drifting 3D snow particles" },
      { id: "thunder", name: "Thunderstorm", category: "storm", code: 95, isDay: true, desc: "Moody storm cloud with 3D electric lightning bolt" },
      { id: "thunder-hail", name: "Storm & Hail", category: "storm", code: 96, isDay: true, desc: "Thunderstorm with faceted icy hail pellets" }
    ];

    const FORECAST_HOURLY = [
      { time: "9AM", temp: "64°" },
      { time: "10AM", temp: "66°" },
      { time: "11AM", temp: "68°" },
      { time: "12PM", temp: "70°" },
      { time: "1PM", temp: "73°" },
      { time: "2PM", temp: "77°" }
    ];

    const state = {
      animating: true,
      timeScale: 1.0,
      activeId: "partly-day"
    };

    let lastTime = performance.now();
    let animTime = 0;

    /* =========================================================================
       PIXEL-PERFECT WINDOWS 11 FLUENT 3D ENGINE
       ========================================================================= */

    /**
     * 1. THE SUN: Pure golden yellow to rich orange sphere
     */
    function drawSun(ctx, cx, cy, r) {
      ctx.save();
      const grad = ctx.createLinearGradient(cx - r * 0.7, cy - r * 0.7, cx + r * 0.7, cy + r * 0.7);
      grad.addColorStop(0.0, "#ffcf00"); // bright sunny golden-yellow
      grad.addColorStop(0.5, "#ff9d00"); // warm tangerine
      grad.addColorStop(1.0, "#ff6a00"); // rich sunset orange

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /**
     * 2. THE MOON: Mathematically exact 3D golden crescent with razor-sharp tapered tips
     */
    function drawMoon(ctx, cx, cy, r) {
      ctx.save();
      const ox = -0.436 * r;
      const oy = -0.182 * r;
      const inR = 0.873 * r;

      const grad = ctx.createLinearGradient(cx - r * 0.5, cy - r * 0.6, cx + r * 0.7, cy + r * 0.7);
      grad.addColorStop(0.0, "#fffde7");
      grad.addColorStop(0.3, "#fff176");
      grad.addColorStop(0.7, "#ffb300");
      grad.addColorStop(1.0, "#ff8f00");

      ctx.fillStyle = grad;
      ctx.beginPath();
      // Outer arc from top tip to bottom tip (clockwise)
      ctx.arc(cx, cy, r, -0.537 * Math.PI, 0.788 * Math.PI, false);
      // Inner arc curving back from bottom tip to top tip (counter-clockwise)
      ctx.arc(cx + ox, cy + oy, inR, 0.631 * Math.PI, -0.380 * Math.PI, true);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    /**
     * 3. THE CLOUD: Authentic Windows 11 smooth curved puff with flat baseline
     * Drawn as composite subpaths (pill + 3 circular dome arcs) for 100% smooth curves
     */
    function drawCloud(ctx, x, y, w, h, isRear, hasShadow) {
      ctx.save();

      if (hasShadow) {
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = h * 0.25;
        ctx.shadowOffsetY = h * 0.12;
        ctx.shadowOffsetX = 0;
      }

      // Smooth cloud dome dimensions
      const rPill = h * 0.24;
      const pillY = y - rPill * 2;
      const pillH = rPill * 2;

      const p1x = x + w * 0.28;
      const p1y = y - h * 0.46;
      const p1r = h * 0.38;

      const p2x = x + w * 0.54;
      const p2y = y - h * 0.58;
      const p2r = h * 0.46;

      const p3x = x + w * 0.76;
      const p3y = y - h * 0.40;
      const p3r = h * 0.34;

      ctx.beginPath();
      // Baseline pill
      ctx.roundRect(x, pillY, w, pillH, rPill);
      // Three overlapping soft dome arcs
      ctx.arc(p1x, p1y, p1r, 0, Math.PI * 2);
      ctx.arc(p2x, p2y, p2r, 0, Math.PI * 2);
      ctx.arc(p3x, p3y, p3r, 0, Math.PI * 2);

      if (isRear) {
        // Soft ice-blue rear cloud
        const rearGrad = ctx.createLinearGradient(0, y - h, 0, y);
        rearGrad.addColorStop(0.0, "#e0f2fe");
        rearGrad.addColorStop(1.0, "#bae6fd");
        ctx.fillStyle = rearGrad;
        ctx.globalAlpha = 0.95;
      } else {
        // Pure pearlescent white front cloud
        const frontGrad = ctx.createLinearGradient(0, y - h, 0, y);
        frontGrad.addColorStop(0.0, "#ffffff");
        frontGrad.addColorStop(0.7, "#f8fafc");
        frontGrad.addColorStop(1.0, "#e2e8f0");
        ctx.fillStyle = frontGrad;
      }

      ctx.fill();
      ctx.restore();
    }

    /**
     * 4. RAIN PILLS: Exact Windows 11 cyan capsule streaks slanted at 22 degrees
     */
    function drawRainPills(ctx, cx, baseY, scale, time, count, isHeavy) {
      const dropSpeed = isHeavy ? 500 : 750;
      const pillW = 2.2 * scale;
      const pillH = (isHeavy ? 6.5 : 5.2) * scale;
      const angle = 22 * Math.PI / 180;
      const sinA = Math.sin(angle);
      const cosA = Math.cos(angle);

      // Staggered isometric slots (3 on top row, 2 on bottom row)
      const slots = [
        { x: -7.5 * scale, y: 3.5 * scale, phase: 0 },
        { x: -1.5 * scale, y: 3.5 * scale, phase: 0.35 },
        { x:  4.5 * scale, y: 3.5 * scale, phase: 0.7 },
        { x: -4.5 * scale, y: 7.2 * scale, phase: 0.5 },
        { x:  1.5 * scale, y: 7.2 * scale, phase: 0.85 },
        { x:  7.5 * scale, y: 7.2 * scale, phase: 0.2 }
      ];

      const numDrops = Math.min(count, slots.length);

      for (let i = 0; i < numDrops; i++) {
        const slot = slots[i];
        const progress = ((time + slot.phase * dropSpeed) % dropSpeed) / dropSpeed;
        const fallDist = 4.0 * scale;

        const x = cx + slot.x - (progress * fallDist * sinA);
        const y = baseY + slot.y + (progress * fallDist * cosA);

        const alpha = Math.sin(progress * Math.PI); // smooth fade in / out

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-angle); // 22 deg slant down-left

        ctx.fillStyle = "#00c2ff"; // pure vibrant cyan
        ctx.globalAlpha = Math.max(0.2, alpha * 0.95);

        ctx.beginPath();
        ctx.roundRect(-pillW / 2, -pillH / 2, pillW, pillH, pillW / 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /**
     * Master Icon Renderer
     */
    function renderWeather(ctx, w, h, cond, time) {
      ctx.clearRect(0, 0, w, h);
      const kind = cond.id;

      // Gentle floating animation
      const floatY = Math.sin(time / 1800) * (h * 0.025);

      /* =========================================================
         CLEAR DAY
         ========================================================= */
      if (kind === "clear-day") {
        const cx = w * 0.5;
        const cy = h * 0.5 + floatY;
        const r = Math.min(w, h) * 0.38;
        drawSun(ctx, cx, cy, r);
        return;
      }

      /* =========================================================
         CLEAR NIGHT
         ========================================================= */
      if (kind === "clear-night") {
        const cx = w * 0.5;
        const cy = h * 0.5 + floatY;
        const r = Math.min(w, h) * 0.36;
        drawMoon(ctx, cx, cy, r);

        // Tiny stars
        const stars = [
          { x: w * 0.22, y: h * 0.28, r: 1.5 },
          { x: w * 0.78, y: h * 0.32, r: 1.8 },
          { x: w * 0.75, y: h * 0.72, r: 1.2 }
        ];
        stars.forEach((s, idx) => {
          const a = 0.5 + 0.5 * Math.sin(time / 400 + idx);
          ctx.save();
          ctx.fillStyle = "#fff59d";
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        return;
      }

      /* =========================================================
         PARTLY DAY (Exact Seattle Big Sun + Front Cloud)
         ========================================================= */
      if (kind === "partly-day") {
        // Sun on the left / upper-center
        const sunCx = w * 0.40;
        const sunCy = h * 0.46 + floatY;
        const sunR = Math.min(w, h) * 0.40;
        drawSun(ctx, sunCx, sunCy, sunR);

        // Cloud overlapping bottom-right of sun
        const cloudW = w * 0.56;
        const cloudH = h * 0.40;
        const cloudX = w * 0.36;
        const cloudY = h * 0.78 + floatY * 0.5;
        drawCloud(ctx, cloudX, cloudY, cloudW, cloudH, false, true);
        return;
      }

      /* =========================================================
         PARTLY NIGHT
         ========================================================= */
      if (kind === "partly-night") {
        const moonCx = w * 0.40;
        const moonCy = h * 0.46 + floatY;
        const moonR = Math.min(w, h) * 0.36;
        drawMoon(ctx, moonCx, moonCy, moonR);

        const cloudW = w * 0.56;
        const cloudH = h * 0.40;
        const cloudX = w * 0.36;
        const cloudY = h * 0.78 + floatY * 0.5;
        drawCloud(ctx, cloudX, cloudY, cloudW, cloudH, false, true);
        return;
      }

      /* =========================================================
         CLOUDY / OVERCAST (Dual Cloud)
         ========================================================= */
      if (kind === "cloudy") {
        // Rear blue cloud
        const rW = w * 0.54;
        const rH = h * 0.38;
        const rX = w * 0.34;
        const rY = h * 0.62 + floatY * 0.6;
        drawCloud(ctx, rX, rY, rW, rH, true, false);

        // Front white cloud
        const fW = w * 0.58;
        const fH = h * 0.42;
        const fX = w * 0.14;
        const fY = h * 0.72 + floatY;
        drawCloud(ctx, fX, fY, fW, fH, false, true);
        return;
      }

      /* =========================================================
         FOG & MIST
         ========================================================= */
      if (kind === "fog") {
        const bands = [
          { y: h * 0.35, w: w * 0.55, h: h * 0.09, speed: 1.0 },
          { y: h * 0.50, w: w * 0.75, h: h * 0.10, speed: 1.4 },
          { y: h * 0.65, w: w * 0.50, h: h * 0.08, speed: 0.8 }
        ];
        bands.forEach((b, idx) => {
          const shift = Math.sin(time / 1600 * b.speed + idx) * (w * 0.04);
          ctx.save();
          ctx.fillStyle = "rgba(241, 245, 249, 0.9)";
          ctx.beginPath();
          ctx.roundRect((w - b.w) / 2 + shift, b.y, b.w, b.h, b.h / 2);
          ctx.fill();
          ctx.restore();
        });
        return;
      }

      /* =========================================================
         RAIN / DRIZZLE / HEAVY RAIN (Exact Forecast Row Icon)
         ========================================================= */
      if (kind === "rain" || kind === "light-rain" || kind === "drizzle" || kind === "heavy-rain") {
        // Dual clouds
        const rW = w * 0.48;
        const rH = h * 0.34;
        const rX = w * 0.40;
        const rY = h * 0.52 + floatY * 0.5;
        drawCloud(ctx, rX, rY, rW, rH, true, false);

        const fW = w * 0.54;
        const fH = h * 0.38;
        const fX = w * 0.16;
        const fY = h * 0.58 + floatY;
        drawCloud(ctx, fX, fY, fW, fH, false, true);

        // Rain drops
        const count = kind === "heavy-rain" ? 6 : (kind === "drizzle" ? 2 : (kind === "light-rain" ? 3 : 5));
        const cx = w * 0.48;
        const baseY = fY + 2;
        const scale = w / 44; // relative to 44px base
        drawRainPills(ctx, cx, baseY, scale, time, count, kind === "heavy-rain");
        return;
      }

      /* =========================================================
         SNOW & BLIZZARD
         ========================================================= */
      if (kind.includes("snow")) {
        const rW = w * 0.48;
        const rH = h * 0.34;
        const rX = w * 0.40;
        const rY = h * 0.52 + floatY * 0.5;
        drawCloud(ctx, rX, rY, rW, rH, true, false);

        const fW = w * 0.54;
        const fH = h * 0.38;
        const fX = w * 0.16;
        const fY = h * 0.58 + floatY;
        drawCloud(ctx, fX, fY, fW, fH, false, true);

        // Soft 3D snowballs
        const snowCount = kind === "heavy-snow" ? 6 : (kind === "light-snow" ? 3 : 4);
        const slots = [-8, -2, 4, -5, 1, 7];
        const sSpeed = 1600;
        for (let i = 0; i < snowCount; i++) {
          const prog = ((time + i * 0.35 * sSpeed) % sSpeed) / sSpeed;
          const sx = w * 0.48 + slots[i % slots.length] * (w / 44) + Math.sin(prog * Math.PI * 2) * 2;
          const sy = fY + 4 + prog * (h * 0.3);
          const sr = (i % 2 === 0 ? 2.2 : 1.7) * (w / 44);
          ctx.save();
          ctx.fillStyle = "#ffffff";
          ctx.globalAlpha = Math.sin(prog * Math.PI);
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        return;
      }

      /* =========================================================
         THUNDERSTORM
         ========================================================= */
      if (kind.includes("thunder")) {
        // Darker storm cloud
        const rW = w * 0.54;
        const rH = h * 0.38;
        const rX = w * 0.34;
        const rY = h * 0.54 + floatY * 0.5;
        drawCloud(ctx, rX, rY, rW, rH, true, false);

        const fW = w * 0.58;
        const fH = h * 0.42;
        const fX = w * 0.14;
        const fY = h * 0.58 + floatY;
        drawCloud(ctx, fX, fY, fW, fH, false, true);

        // Electric golden bolt (always visible with flash pulse)
        const strike = time % 2200;
        let boltAlpha = 0.75;
        if (strike > 1800 && strike < 1840) boltAlpha = 1;
        else if (strike >= 1840 && strike < 1870) boltAlpha = 0.4;
        else if (strike >= 1870 && strike < 1920) boltAlpha = 1;
        else if (strike >= 1920 && strike < 2100) boltAlpha = 0.75 + 0.25 * (1 - (strike - 1920) / 180);

        ctx.save();
        ctx.translate(w * 0.48, fY + 2);
        const bs = w / 44;
        ctx.fillStyle = "#ffd000";
        ctx.shadowColor = "#ff9100";
        ctx.shadowBlur = 8;
        ctx.globalAlpha = boltAlpha;

        ctx.beginPath();
        ctx.moveTo(1.5 * bs, 0);
        ctx.lineTo(-1.5 * bs, 5 * bs);
        ctx.lineTo(0.5 * bs, 5 * bs);
        ctx.lineTo(-1.0 * bs, 11 * bs);
        ctx.lineTo(4.5 * bs, 4.5 * bs);
        ctx.lineTo(2.0 * bs, 4.5 * bs);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Falling drops alongside bolt
        drawRainPills(ctx, w * 0.48, fY + 2, w / 44, time, 4, false);
      }
    }

    /* =========================================================
       DOM SETUP
       ========================================================= */
    const heroBigCanvas = document.getElementById("heroBigCanvas");
    const forecastStrip = document.getElementById("forecastStrip");
    const gridContainer = document.getElementById("gridContainer");

    function setupUI() {
      // 1. Forecast row
      forecastStrip.innerHTML = "";
      FORECAST_HOURLY.forEach((fc, idx) => {
        const col = document.createElement("div");
        col.className = "forecast-item";
        col.innerHTML = `
          <span class="forecast-time">${fc.time}</span>
          <div class="forecast-canvas-wrap">
            <canvas id="fc-canvas-${idx}" width="88" height="88" style="width: 44px; height: 44px;"></canvas>
          </div>
          <span class="forecast-temp">${fc.temp}</span>
        `;
        forecastStrip.appendChild(col);
      });

      // 2. 15 Icon Cards Grid
      gridContainer.innerHTML = "";
      CONDITIONS.forEach(cond => {
        const card = document.createElement("div");
        card.className = "icon-card";
        if (cond.id === state.activeId) card.classList.add("active-card");
        card.dataset.id = cond.id;
        card.dataset.category = cond.category;

        card.innerHTML = `
          <div class="card-meta-top">
            <span class="card-label">${cond.name}</span>
            <span class="code-badge">code: ${cond.code}</span>
          </div>
          <div class="icon-preview-box">
            <canvas id="grid-canvas-${cond.id}" width="180" height="180" style="width: 90px; height: 90px;"></canvas>
          </div>
          <div class="card-desc">${cond.desc}</div>
        `;

        card.addEventListener("click", () => {
          state.activeId = cond.id;
          document.querySelectorAll(".icon-card").forEach(c => c.classList.remove("active-card"));
          card.classList.add("active-card");
          document.getElementById("heroCondTitle").textContent = cond.name;
        });

        gridContainer.appendChild(card);
      });

      setupFilters();
    }

    function setupFilters() {
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const filter = btn.dataset.filter;
          document.querySelectorAll(".icon-card").forEach(card => {
            if (filter === "all" || card.dataset.category === filter) {
              card.style.display = "flex";
            } else {
              card.style.display = "none";
            }
          });
        });
      });
    }

    /* =========================================================
       ANIMATION LOOP
       ========================================================= */
    function tick(now) {
      const dt = (now - lastTime) * state.timeScale;
      lastTime = now;

      if (state.animating) {
        animTime += dt;
      }

      const dpr = 2;

      // 1. Render Big Hero Canvas
      if (heroBigCanvas) {
        const ctx = heroBigCanvas.getContext("2d");
        ctx.save();
        ctx.scale(dpr, dpr);
        const activeCond = CONDITIONS.find(c => c.id === state.activeId) || CONDITIONS[0];
        renderWeather(ctx, 110, 90, activeCond, animTime);
        ctx.restore();
      }

      // 2. Render Forecast row (Rain icon at 44px)
      const rainCond = CONDITIONS.find(c => c.id === "rain");
      FORECAST_HOURLY.forEach((fc, idx) => {
        const cv = document.getElementById(`fc-canvas-${idx}`);
        if (cv) {
          const ctx = cv.getContext("2d");
          ctx.save();
          ctx.scale(dpr, dpr);
          renderWeather(ctx, 44, 44, rainCond, animTime);
          ctx.restore();
        }
      });

      // 3. Render 15 Grid Icons (90px)
      CONDITIONS.forEach(cond => {
        const cv = document.getElementById(`grid-canvas-${cond.id}`);
        if (cv) {
          const ctx = cv.getContext("2d");
          ctx.save();
          ctx.scale(dpr, dpr);
          renderWeather(ctx, 90, 90, cond, animTime);
          ctx.restore();
        }
      });

      requestAnimationFrame(tick);
    }

    /* =========================================================
       CONTROLS
       ========================================================= */
    document.getElementById("btnThemePurple").addEventListener("click", () => {
      document.getElementById("heroCard").style.background = "linear-gradient(135deg, rgba(94, 92, 230, 0.75) 0%, rgba(59, 130, 246, 0.65) 100%)";
      document.getElementById("btnThemePurple").classList.add("active");
      document.getElementById("btnThemeDark").classList.remove("active");
    });

    document.getElementById("btnThemeDark").addEventListener("click", () => {
      document.getElementById("heroCard").style.background = "linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%)";
      document.getElementById("btnThemeDark").classList.add("active");
      document.getElementById("btnThemePurple").classList.remove("active");
    });

    const btnPlay = document.getElementById("btnAnimPlay");
    btnPlay.addEventListener("click", () => {
      state.animating = !state.animating;
      btnPlay.textContent = state.animating ? "Play" : "Pause";
      btnPlay.classList.toggle("active", state.animating);
    });

    const btnSlow = document.getElementById("btnAnimSlow");
    btnSlow.addEventListener("click", () => {
      state.timeScale = state.timeScale === 1.0 ? 0.4 : 1.0;
      btnSlow.classList.toggle("active", state.timeScale !== 1.0);
    });

    /* =========================================================
       INIT
       ========================================================= */
    setupUI();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
